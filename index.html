<div id="mdl" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center;padding:16px"><div class="part" style="width:100%;max-width:420px;margin:0"><h3>Fichier Excel créé</h3><div class="cap">Envoyer par e-mail à :</div><input id="mail" type="email" placeholder="Adresse e-mail" autocomplete="email"><div class="btns"><button class="p" id="bSend">✉️ Envoyer</button><button id="bNo">Fermer</button></div><div id="mm" style="font-size:.85rem;color:var(--mu);margin-top:6px"></div></div></div>
<script>
const $=id=>document.getElementById(id),H={zone:'Zone n°',pi:'PI n°'};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function lab(t,small){return '<span class="b">'+t[0]+'</span>'+(small?'<span class="sm">'+t.slice(1)+'</span>':t.slice(1))}
const AB=/^(IBE|UBE|UEM|UVE|U0|UVR|UV1V2|UR1R2|IBR|UBR|UPI|IBPI|UBPI|UCI)$/;
const L=t=>AB.test(t)?lab(t):t;
function field(k,t,h){H[k]=h;return '<div class="row"><span class="l">'+L(t)+'</span><input data-k="'+k+'" autocomplete="off"></div>'}
const rows=(p,arr,h)=>arr.map(t=>field(p+'_'+t,t,h+' '+t)).join('');
const part=(cls,t,body)=>'<div class="part '+cls+'"><h3>'+t+'</h3>'+body+'</div>';
// Onglet 1
$('t0').innerHTML=part('','Émission',rows('c_em',['Émetteur','TAd','SVa','BA','CI'],'Constitution Émission'))
+part('','Réception',rows('c_re',['BA','SVa','TAd','Récepteur','CI'],'Constitution Réception'))
+part('pi','PI',rows('c_pi',['TAd','Récepteur'],'Constitution PI'));
// Onglet 2
function sel(k,h,opts){H[k]=h;return '<div class="sel"><span class="v"></span><select data-k="'+k+'"><option value=""></option>'+opts.map(o=>'<option value="'+o[0]+'">'+o+'</option>').join('')+'</select></div>'}
H.m_date='Date';H.m_pi_mb='Méthode B PI';H.m_pi_UR1R2='Mesures PI UR1R2';H.m_pi_rouge='Mesures PI UR1R2 (rouge)';H.m_mb='Méthode B';H.m_re_UR1R2='Mesures Réception UR1R2';H.m_re_rouge='Mesures Réception UR1R2 (rouge)';
$('t1').innerHTML=part('','Éphéméride','<div class="line"><div><div class="cap">Date</div><input data-k="m_date" inputmode="numeric" placeholder="jj/mm/aaaa" maxlength="10"></div><div><div class="cap">Temps</div>'+sel('m_t1','Temps 1',['Chaud','Temp','Froid'])+'</div><div><div class="cap">Temps</div>'+sel('m_t2','Temps 2',['Sec','Normal','Humide'])+'</div></div>')
+part('','CdV · Émission',rows('m_em',['IBE','UBE','UEM','UVE','U0'],'Mesures Émission'))
+part('','CdV · Réception','<div class="row"><input type="checkbox" data-k="m_mb"><span>Méthode B</span></div>'+rows('m_re',['UVR','UV1V2'],'Mesures Réception')
+'<div class="row"><span class="l">'+lab('UR1R2')+'</span><input data-k="m_re_UR1R2"><input data-k="m_re_rouge" class="red mb" data-for="m_mb" style="display:none"></div>'
+rows('m_re',['IBR','UBR'],'Mesures Réception'))
+part('pi','PI','<div class="row"><input type="checkbox" data-k="m_pi_mb"><span>Méthode B</span></div>'+rows('m_pi',['UPI','UV1V2'],'Mesures PI')+'<div class="row"><span class="l">'+lab('UR1R2')+'</span><input data-k="m_pi_UR1R2"><input data-k="m_pi_rouge" class="red mb" data-for="m_pi_mb" style="display:none"></div>'+rows('m_pi',['IBPI','UBPI'],'Mesures PI'))
+part('','CI',field('m_ci_UCI','UCI','Mesures CI UCI'));
// Onglet 3
const bf=(k,kk,h)=>{H[k]=h;return '<div><div class="cap">'+(kk=='K'?lab('KRV',1):lab('UR1R2',1))+'</div><input data-k="'+k+'" inputmode="decimal" autocomplete="off"></div>'};
$('t2').innerHTML='<div class="part"><div class="grid"><div class="hd">KRV de base</div><div class="hd">KRV final</div>'
+bf('b_kb','K','Méthode B KRV base')+bf('b_kf','K','Méthode B KRV final')+bf('b_ub','U','Méthode B UR1R2 base')+bf('b_uf','U','Méthode B UR1R2 final')+'</div>'
+'<p style="color:var(--mu);font-size:.85rem;margin:10px 0 0">Saisissez 3 valeurs : la 4e est calculée.</p></div>';
const SUB={t0:[['em','Émission'],['re','Réception'],['pi','PI']],t1:[['eph','📅','Éphéméride'],['em','Emz'],['re','Rez'],['pi','PI'],['ci','CI']]};
function initSub(t){const box=$(t),ps=[...box.querySelectorAll(':scope>.part,:scope>.wr')],nav=document.createElement('div');nav.className='sub';
 SUB[t].forEach(([id,n,ti],i)=>{ps[i].dataset.sp=id;const b=document.createElement('button');b.innerHTML=(n=='Emz'||n=='Rez')?lab(n):n;if(ti)b.title=ti;b.dataset.sp=id;if(id=='pi')b.className='pi';b.onclick=()=>subshow(t,id);nav.appendChild(b)});box.prepend(nav);
 subshow(t,store.get('sub'+t)||SUB[t][0][0])}
['t0','t1'].forEach(initSub);
function subshow(t,id){const box=$(t);box.dataset.cur=id;box.querySelectorAll(':scope>.part,:scope>.wr').forEach(p=>p.classList.toggle('sp-hide',p.dataset.sp!=id));box.querySelectorAll('.sub button').forEach(b=>b.classList.toggle('on',b.dataset.sp==id));store.set('sub'+t,id)}
// Onglets
const names=['Constitution','Mesures','Méthode "B"','KCA'];
names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(i);b.id='tb'+i;$('tabs').appendChild(b)});
function show(i){names.forEach((_,j)=>{$('t'+j).classList.toggle('on',i==j);$('tb'+j).classList.toggle('on',i==j)});store.set('tab',i)}
function refresh(){const pi=$('pi').value.trim()!=='';document.querySelectorAll('.pi').forEach(e=>e.style.display=pi?'':'none');
 document.querySelectorAll('.mb').forEach(e=>{e.style.display=document.querySelector('[data-k='+e.dataset.for+']').checked?'':'none'});
 document.querySelectorAll('.sel').forEach(s=>{s.querySelector('.v').textContent=s.querySelector('select').value});['t0','t1','t3'].forEach(t=>{if(!pi&&$(t).dataset.cur=='pi')subshow(t,SUB[t][0][0])})}
function calcB(){const el=['b_kb','b_ub','b_kf','b_uf'].map(k=>document.querySelector('[data-k='+k+']'));
 el.forEach(e=>{if(e.dataset.auto){e.value='';delete e.dataset.auto;e.classList.remove('auto')}});
 if(el.filter(e=>e.value.trim()!=='').length!==3)return;
 const m=el.findIndex(e=>e.value.trim()==='');const v=el.map(e=>parseFloat(e.value.replace(',','.')));
 if(v.some((x,i)=>i!==m&&isNaN(x)))return;const[kb,ub,kf,uf]=v;
 const r=[kf*ub/uf,kb*uf/kf,kb*uf/ub,ub*kf/kb][m];if(!isFinite(r))return;
 let t;if(m==1||m==3)t=r.toFixed(3).replace('.',',');else{const f=Math.floor(r+1e-9),d=r-f;t=f+(d<1e-9?'':Math.abs(d-.5)<1e-9?'=':d>.5?'+':'-')}
 el[m].value=t;el[m].dataset.auto=1;el[m].classList.add('auto')}
const inputs=()=>[...document.querySelectorAll('[data-k]')];
function gather(){const o={zone:$('zone').value.trim(),pi:$('pi').value.trim()};inputs().forEach(e=>{o[e.dataset.k]=e.type=='checkbox'?(e.checked?'oui':''):(e.dataset.auto?'':e.value)});return o}
function fill(o){$('zone').value=o.zone||'';$('pi').value=o.pi||'';inputs().forEach(e=>{const v=o[e.dataset.k]||'';delete e.dataset.auto;e.classList.remove('auto');if(e.type=='checkbox')e.checked=v=='oui';else e.value=v});calcB();calcK();refresh()}
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset&&t.dataset.auto){delete t.dataset.auto;t.classList.remove('auto')}
 if(t.dataset.k=='m_date'){const d=t.value.replace(/\D/g,'').slice(0,8);t.value=d.replace(/^(\d{2})(\d)/,'$1/$2').replace(/^(\d{2}\/\d{2})(\d)/,'$1/$2')}
 if(t.dataset.k&&t.dataset.k.startsWith('b_'))calcB();refresh();store.set('draft',JSON.stringify(gather()))});
document.addEventListener('change',refresh);
const R=()=>{try{return JSON.parse(store.get('recs')||'{}')}catch(e){return {}}};
let cur=null;
const say=m=>{$('st').textContent=m};
function list(sel){const s=$('recs');s.innerHTML='<option value="">— Enregistrements —</option>';Object.keys(R()).sort().forEach(k=>{const o=document.createElement('option');o.textContent=k;s.appendChild(o)});if(sel)s.value=sel}
function save(){const o=gather();if(!o.zone){say('Saisissez un Zone n° pour enregistrer.');return false}const r=R();r[o.zone]=o;store.set('recs',JSON.stringify(r));cur=o.zone;list(cur);say('Enregistrement « '+o.zone+' » sauvegardé.');return true}
$('bSave').onclick=save;
$('bOpen').onclick=()=>{const k=$('recs').value;if(!k)return say('Choisissez un enregistrement.');fill(R()[k]);cur=k;say('Enregistrement « '+k+' » ouvert.')};
$('bClose').onclick=()=>{if($('zone').value.trim())save();fill({});cur=null;store.set('draft','{}');$('recs').value='';say('Enregistrement fermé.')};
$('bDel').onclick=()=>{const k=$('recs').value||cur;if(!k)return say('Choisissez un enregistrement.');const c=$('cf');
 c.innerHTML='<div style="margin-top:8px">Supprimer « '+k.replace(/</g,'&lt;')+' » ? Cette action est définitive.</div><div class="btns"><button class="r" id="cfY">Oui, supprimer</button><button id="cfN">Annuler</button></div>';
 $('cfN').onclick=()=>{c.innerHTML=''};
 $('cfY').onclick=()=>{c.innerHTML='';const r=R();delete r[k];store.set('recs',JSON.stringify(r));if(cur==k){fill({});cur=null}list();say('Enregistrement « '+k+' » supprimé.')}};
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 files.forEach(([n,t])=>{const nb=enc.encode(n),d=enc.encode(t),c=crc(d);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);
  parts.push(new Uint8Array(h.buffer),nb,d);
  const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(14,0x21,true);e.setUint32(16,c,true);e.setUint32(20,d.length,true);e.setUint32(24,d.length,true);e.setUint16(28,nb.length,true);e.setUint32(42,off,true);
  cd.push(new Uint8Array(e.buffer),nb);off+=30+nb.length+d.length});
 const cl=cd.reduce((q,x)=>q+x.length,0),z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,files.length,true);z.setUint16(10,files.length,true);z.setUint32(12,cl,true);z.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(z.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
const X=t=>String(t).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const col=i=>{let q='';for(i++;i>0;i=Math.floor((i-1)/26))q=String.fromCharCode(65+(i-1)%26)+q;return q};
const HD='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',RL='http://schemas.openxmlformats.org/officeDocument/2006/relationships',PK='http://schemas.openxmlformats.org/package/2006/relationships';
const sheetXml=rows=>HD+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+rows.map((r,i)=>'<row r="'+(i+1)+'">'+r.map((v,j)=>v===''?'':'<c r="'+col(j)+(i+1)+'" t="inlineStr"><is><t xml:space="preserve">'+X(v)+'</t></is></c>').join('')+'</row>').join('')+'</sheetData></worksheet>';
function xlsxBlob(s1,s2){return zip([
 ['[Content_Types].xml',HD+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],
 ['_rels/.rels',HD+'<Relationships xmlns="'+PK+'"><Relationship Id="rId1" Type="'+RL+'/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
 ['xl/workbook.xml',HD+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="'+RL+'"><sheets><sheet name="Constitution" sheetId="1" r:id="rId1"/><sheet name="Mesures" sheetId="2" r:id="rId2"/></sheets></workbook>'],
 ['xl/_rels/workbook.xml.rels',HD+'<Relationships xmlns="'+PK+'"><Relationship Id="rId1" Type="'+RL+'/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="'+RL+'/worksheet" Target="worksheets/sheet2.xml"/></Relationships>'],
 ['xl/worksheets/sheet1.xml',sheetXml(s1)],['xl/worksheets/sheet2.xml',sheetXml(s2)]])}
async function xls(){const r=R(),o=gather();if(o.zone)r[o.zone]=o;const rs=Object.values(r);if(!rs.length){say('Aucun enregistrement à exporter.');return false}
 const keys=Object.keys(H),sheet=p=>{const ks=keys.filter(k=>k=='zone'||k=='pi'||k.startsWith(p));return [ks.map(k=>H[k])].concat(rs.map(x=>ks.map(k=>x[k]||'')))};
 const blob=xlsxBlob(sheet('c_'),sheet('m_')),n=new Date(),name='mesures_'+[n.getFullYear()%100,n.getMonth()+1,n.getDate()].map(x=>String(x).padStart(2,'0')).join('-')+'.xlsx';
 try{const f=new File([blob],name,{type:blob.type});
