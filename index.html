.sub .cam{margin-left:auto;padding:8px 12px}.sub svg{width:20px;height:20px;vertical-align:middle}
#wm{position:fixed;left:50%;width:min(100%,640px);transform:translateX(-50%);top:0;bottom:0;background:url(filigrane.svg) center/contain no-repeat;opacity:.13;pointer-events:none;z-index:5}:root[data-theme="dark"] #wm{opacity:.2}

<div class="btns"><button id="bImp" title="Importer" aria-label="Importer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13v6h14v-6"/><path d="M12 3v11M8 10l4 4 4-4"/></svg></button><button class="g" id="bSave" title="Enregistrer" aria-label="Enregistrer">💾</button><button id="bOpen" title="Ouvrir" aria-label="Ouvrir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16M6 21V3h12v18"/><path d="M6 3l8 2.5v13L6 21z"/><path d="M11.5 12h.01"/></svg></button><button id="bClose" title="Fermer" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16"/><rect x="6" y="3" width="12" height="18"/><path d="M15 12h.01"/></svg></button><button class="bl" id="bXls" title="Exporter" aria-label="Exporter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13v6h14v-6"/><path d="M12 15V4M8 8l4-4 4 4"/></svg></button><button class="r" id="bDel" title="Supprimer" aria-label="Supprimer" style="margin-left:auto">🗑️</button></div><div id="cf"></div>

<div id="mdl" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center;padding:16px"><div class="part" style="width:100%;max-width:420px;margin:0"><h3>Fichier Excel créé</h3><div class="cap">Envoyer par e-mail à :</div><input id="mail" type="email" placeholder="Adresse e-mail" autocomplete="email"><div class="btns"><button class="p" id="bSend">✉️ Envoyer</button><button id="bNo">Fermer</button></div><div id="mm" style="font-size:.85rem;color:var(--mu);margin-top:6px"></div></div></div>

<script>
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function lab(t){return '<span class="b">'+t[0]+'</span>'+t.slice(1)}
const ABR=/\b(IBE|UBE|UEM|UVE|U0|UVR|UV1V2|UR1R2|IBR|UBR|UPI|IBPI|UBPI|UCI|KRV|KCA|Emz|Rez)\b/g,fm=t=>t.replace(ABR,a=>lab(a)),L=fm;

const rows=(p,arr)=>arr.map(t=>field(p+'_'+t,t)).join('');
const part=(cls,t,body)=>'<div class="part '+cls+'"><h3>'+t+'</h3>'+body+'</div>';
// Onglet 1
$('t0').innerHTML=part('','Émission',rows('c_em',['Émetteur','TAd','SVa','BA','CI']))
+part('','Réception',rows('c_re',['BA','SVa','TAd','Récepteur','CI']))
+part('pi','PI',rows('c_pi',['TAd','Récepteur']));
// Onglet 2
function sel(k,opts){return '<div class="sel"><span class="v"></span><select data-k="'+k+'"><option value=""></option>'+opts.map(o=>'<option value="'+o[0]+'">'+o+'</option>').join('')+'</select></div>'}
$('t1').innerHTML=part('','Éphéméride','<div class="line"><div><div class="cap">Date</div><input data-k="m_date" inputmode="numeric" placeholder="jj/mm/aaaa" maxlength="10"></div><div><div class="cap">Temps</div>'+sel('m_t1',['Chaud','Temp','Froid'])+'</div><div><div class="cap">Temps</div>'+sel('m_t2',['Sec','Normal','Humide'])+'</div></div>')
+part('','CdV · Émission',rows('m_em',['IBE','UBE','UEM','UVE','U0']))
+part('','CdV · Réception','<div class="row"><input type="checkbox" data-k="m_mb"><span>Méthode B</span></div>'+rows('m_re',['UVR','UV1V2'])
+'<div class="row"><span class="l">'+lab('UR1R2')+'</span><input data-k="m_re_UR1R2"><input data-k="m_re_rouge" class="red mb" data-for="m_mb" style="display:none"></div>'
+rows('m_re',['IBR','UBR']))
+part('pi','PI','<div class="row"><input type="checkbox" data-k="m_pi_mb"><span>Méthode B</span></div>'+rows('m_pi',['UPI','UV1V2'])+'<div class="row"><span class="l">'+lab('UR1R2')+'</span><input data-k="m_pi_UR1R2"><input data-k="m_pi_rouge" class="red mb" data-for="m_pi_mb" style="display:none"></div>'+rows('m_pi',['IBPI','UBPI']))
+part('','CI',field('m_ci_UCI','UCI'));
// Onglet 3
const bf=(k,kk)=>{return '<div><div class="cap">'+fm(kk=='K'?'KRV':'UR1R2')+'</div><input data-k="'+k+'" inputmode="decimal" autocomplete="off"></div>'};
$('t2').innerHTML='<div class="part"><div class="grid"><div class="hd">'+fm('KRV de base')+'</div><div class="hd">'+fm('KRV final')+'</div>'
+bf('b_kb','K')+bf('b_kf','K')+bf('b_ub','U')+bf('b_uf','U')+'</div>'
+'<p style="color:var(--mu);font-size:.85rem;margin:10px 0 0">Saisissez 3 valeurs : la 4e est calculée.</p></div>';
const SUB={t0:[['em','Émission'],['re','Réception'],['pi','PI']],t1:[['eph','📅','Éphéméride'],['em','Emz'],['re','Rez'],['pi','PI'],['ci','CI']]};
function initSub(t){const box=$(t),ps=[...box.querySelectorAll(':scope>.part,:scope>.wr')],nav=document.createElement('div');nav.className='sub';
 SUB[t].forEach(([id,n,ti],i)=>{ps[i].dataset.sp=id;const b=document.createElement('button');b.innerHTML=fm(n);if(ti)b.title=ti;b.dataset.sp=id;if(id=='pi')b.className='pi';b.onclick=()=>subshow(t,id);nav.appendChild(b)});box.prepend(nav);
 subshow(t,store.get('sub'+t)||SUB[t][0][0])}
['t0','t1'].forEach(initSub);
function subshow(t,id){const box=$(t);box.dataset.cur=id;box.querySelectorAll(':scope>.part,:scope>.wr').forEach(p=>p.classList.toggle('sp-hide',p.dataset.sp!=id));box.querySelectorAll('.sub button').forEach(b=>b.classList.toggle('on',b.dataset.sp==id));store.set('sub'+t,id)}
// Onglets
const LET=['','A','B','C','D','E','F','G','H','I','K','L','M','/'],RL=['','R1','R2','R3','R4','R5','R6','R7','R8','R9','R10'];
const opt=a=>a.map(l=>'<option>'+l+'</option>').join(''),ls=k=>'<select data-k="'+k+'">'+opt(LET)+'</select>',RM=RL.filter(x=>x!=='R1'&&x!=='R2'),rsel=k=>'<select data-k="'+k+'">'+opt(RM)+'</select>',rro=k=>'<input readonly data-k="'+k+'">';
const grid=(p,rw)=>{const f=rw?rsel:rro,c=i=>f(p+'_'+i),a='<div class="a">à</div>';
 return '<div class="row"><span class="kl">'+fm('KRV')+'</span><input data-k="'+p+'_krv" '+(rw?'inputmode="numeric" autocomplete="off"':'readonly')+'></div><div class="g4"><div class="t">R1</div>'+a+c(1)+'<div class="t">R2</div>'+a+c(2)+c(3)+a+c(4)+c(5)+a+c(6)+'</div>'};
const sec=(cls,id,t,b,m)=>'<div class="part '+cls+'"><h3>'+t+'</h3><div class="two"><div class="kg"><div class="hd">de base</div>'+grid(b,0)+'</div><div class="kg rd" id="'+id+'"><div class="hd">Méthode "B"</div>'+grid(m,1)+'</div></div></div>';
$('t4').innerHTML='<div class="part"><div class="row"><span class="kl">'+lab('KCA')+'</span><input data-k="r_kca" autocomplete="off"></div><div class="g4b"><div class="hd">Condensateur</div><div class="hd" style="grid-column:span 3">Liaisons sur CIT</div>'
+ls('r_c1')+ls('r_l1a')+'<div class="a">à</div>'+ls('r_l2a')+ls('r_c2')+ls('r_l1b')+'<div class="a">à</div>'+ls('r_l2b')+'</div></div>'
+sec('','rgcB','CdV','kb','km')+sec('pi','rgpB','PI','pb','pm');
const names=['Constitution','Réglages','Mesures','🔧'],TP=['t0','t4','t1','t5'];
names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;if(n=='🔧')b.title='Outils';b.onclick=()=>show(i);b.id='tb'+i;$('tabs').appendChild(b)});
function show(i){names.forEach((_,j)=>{$(TP[j]).classList.toggle('on',i==j);$('tb'+j).classList.toggle('on',i==j)});store.set('tab',i)}
function refresh(){const pi=$('pi').value.trim()!==''&&$('pi').value.trim()!=='/';document.querySelectorAll('.pi').forEach(e=>e.style.display=pi?'':'none');
 document.querySelectorAll('.mb').forEach(e=>{e.style.display=document.querySelector('[data-k='+e.dataset.for+']').checked?'':'none'});
 document.querySelectorAll('.sel').forEach(s=>{s.querySelector('.v').textContent=s.querySelector('select').value});$('rgcB').style.display=document.querySelector('[data-k=m_mb]').checked?'':'none';$('rgpB').style.display=document.querySelector('[data-k=m_pi_mb]').checked?'':'none';
 ['kb','km','pb','pm'].forEach(p=>{const v=[1,2,3,4,5,6].map(i=>document.querySelector('[data-k='+p+'_'+i+']')),n=v.map(e=>e.value).filter(Boolean),d=new Set(n).size<n.length;v.forEach(e=>e.classList.toggle('dup',d))});
 ['t0','t1'].forEach(t=>{if(!pi&&$(t).dataset.cur=='pi')subshow(t,SUB[t][0][0])})}
function calcB(){const el=['b_kb','b_ub','b_kf','b_uf'].map(k=>document.querySelector('[data-k='+k+']'));
 el.forEach(e=>{if(e.dataset.auto){e.value='';delete e.dataset.auto;e.classList.remove('auto')}});
 if(el.filter(e=>e.value.trim()!=='').length!==3)return;
 const m=el.findIndex(e=>e.value.trim()==='');const v=el.map(e=>parseFloat(e.value.replace(',','.')));
 if(v.some((x,i)=>i!==m&&isNaN(x)))return;const[kb,ub,kf,uf]=v;
 const r=[kf*ub/uf,kb*uf/kf,kb*uf/ub,ub*kf/kb][m];if(!isFinite(r))return;
 let t;if(m==1||m==3)t=r.toFixed(3).replace('.',',');else{const f=Math.floor(r+1e-9),d=r-f;t=f+(d<1e-9?'':Math.abs(d-.5)<1e-9?'=':d>.5?'+':'-')}
 el[m].value=t;el[m].dataset.auto=1;el[m].classList.add('auto')}
const inputs=()=>[...document.querySelectorAll('[data-k]')];
function gather(){const o={zone:$('zone').value.trim(),pi:$('pi').value.trim()};inputs().forEach(e=>{o[e.dataset.k]=e.type=='checkbox'?(e.checked?'oui':''):(e.dataset.auto?'':e.value)});return o}
function fill(o){$('zone').value=o.zone||'';$('pi').value=o.pi||'';inputs().forEach(e=>{const v=o[e.dataset.k]||'';delete e.dataset.auto;e.classList.remove('auto');if(e.type=='checkbox')e.checked=v=='oui';else e.value=v});calcB();calcK();loadSync();refresh()}
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset&&t.dataset.auto){delete t.dataset.auto;t.classList.remove('auto')}
 if(t.dataset.k=='m_date'){const d=t.value.replace(/\D/g,'').slice(0,8);t.value=d.replace(/^(\d{2})(\d)/,'$1/$2').replace(/^(\d{2}\/\d{2})(\d)/,'$1/$2')}
 if(t.dataset.k&&NUMK(t.dataset.k)){let v=t.value.replace(/[^0-9.,]/g,'');const i=v.search(/[.,]/);if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/[.,]/g,'').slice(0,3);t.value=v}
 if(/^(km|pm)_krv$/.test(t.dataset.k||''))t.value=t.value.replace(/\D/g,'');
 if(t.dataset.k&&t.dataset.k.startsWith('b_'))calcB();refresh();store.set('draft',JSON.stringify(gather()))});
document.addEventListener('change',refresh);
const R=()=>{try{return JSON.parse(store.get('recs')||'{}')}catch(e){return {}}};
let cur=null;
const say=m=>{$('st').textContent=m};
function list(sel){const s=$('recs');s.innerHTML='<option value="">— Enregistrements —</option>';Object.keys(R()).sort().forEach(k=>{const o=document.createElement('option');o.textContent=k;s.appendChild(o)});if(sel)s.value=sel}
let curSrc=null;
function save(){const o=gather(),k=recName(o);if(!k){say('Saisissez un Zone n° pour enregistrer.');return false}const r=R();o.src=curSrc||(r[k]||{}).src;if(!o.src)delete o.src;r[k]=o;store.set('recs',JSON.stringify(r));cur=k;list(k);say('Enregistrement « '+k+' » sauvegardé.');return true}
$('bSave').onclick=save;
$('bOpen').onclick=()=>{const k=$('recs').value;if(!k)return say('Choisissez un enregistrement.');fill(R()[k]);cur=k;curSrc=R()[k].src||null;say('Enregistrement « '+k+' » ouvert.')};
$('bClose').onclick=()=>{if($('zone').value.trim())save();fill({});cur=null;curSrc=null;store.set('draft','{}');$('recs').value='';say('Enregistrement fermé.')};
$('bDel').onclick=()=>{const k=$('recs').value||cur;if(!k)return say('Choisissez un enregistrement.');const c=$('cf');
 c.innerHTML='<div style="margin-top:8px">Supprimer « '+k.replace(/</g,'&lt;')+' » ? Cette action est définitive.</div><div class="btns"><button class="r" id="cfY">Oui, supprimer</button><button id="cfN">Annuler</button></div>';
 $('cfN').onclick=()=>{c.innerHTML=''};
 $('cfY').onclick=()=>{c.innerHTML='';const r=R();delete r[k];store.set('recs',JSON.stringify(r));if(cur==k){fill({});cur=null}list();say('Enregistrement « '+k+' » supprimé.')}};
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
const NOK=['m_date','m_t1','m_t2','m_mb','m_pi_mb'];
const NUMK=k=>k.startsWith('m_')&&!NOK.includes(k);
const xname=z=>{const n=new Date(),q=z.replace(/[\\\/:*?"<>|\s]+/g,'-');return 'mesures_'+(q?q+'_':'')+[n.getFullYear()%100,n.getMonth()+1,n.getDate()].map(x=>String(x).padStart(2,'0')).join('-')+'.xlsx'};
const FM={zone:'BT2',pi:'CB3',c_em_Émetteur:'N26',c_em_TAd:'U26',c_em_SVa:'AA26',c_em_BA:'AG26',c_em_CI:'AN26',c_re_BA:'AU26',c_re_SVa:'BB26',c_re_TAd:'BI26',c_re_Récepteur:'BP26',c_re_CI:'BW26',c_pi_TAd:'N38',c_pi_Récepteur:'U38',
 m_date:'B140',m_t1:'G140',m_t2:'J140',m_em_IBE:'M140',m_em_UBE:'P140',m_em_UEM:'S140',m_em_UVE:'V140',m_re_UVR:'Y140',m_re_UV1V2:'AB140',m_re_UR1R2:'AE140',m_re_IBR:'AH140',m_re_UBR:'AK140',

function calcK(){const g=k=>document.querySelector('[data-k='+k+']').value,a=g('k_c1'),b=g('k_c2'),r=$('k_res');
 const br=[['k_p1a','k_p1b'],['k_p2a','k_p2b']].map(([x,y])=>[g(x),g(y)]).filter(p=>p[0]&&p[1]);let out=null;
 const go=(cur,used,seen,s)=>{if(out!==null)return;if(POS[cur][0]==POS[b][0]){out=s+POS[b][1]-POS[cur][1];return}
  br.forEach((p,i)=>{if(used.includes(i))return;[[p[0],p[1]],[p[1],p[0]]].forEach(([x,y])=>{if(POS[x][0]==POS[cur][0]&&!seen.includes(POS[y][0]))go(y,used.concat(i),seen.concat(POS[y][0]),s+POS[x][1]-POS[cur][1])})})};

 r.value=!(a&&b)?'':out===null?'Circuit ouvert':out;r.classList.toggle('auto',out!==null)}
const TL=Object.keys(POS);
function sums(a,b,br){const out=[];out.ng=[];const go=(cur,used,seen,s,n)=>{if(POS[cur][0]==POS[b][0]){if(used.length==br.length){out.push(s+POS[b][1]-POS[cur][1]);out.ng.push(n+(POS[b][1]<POS[cur][1]))}return}
 br.forEach((p,i)=>{if(used.includes(i))return;[[p[0],p[1]],[p[1],p[0]]].forEach(([x,y])=>{if(POS[x][0]==POS[cur][0]&&!seen.includes(POS[y][0]))go(y,used.concat(i),seen.concat(POS[y][0]),s+POS[x][1]-POS[cur][1],n+(POS[x][1]<POS[cur][1]))})})};go(a,[],[POS[a][0]],0,0);return out}
const cp=[];TL.forEach((x,i)=>TL.slice(i+1).forEach(y=>{if(POS[x][0]!=POS[y][0])cp.push([x,y])}));
function solve(v){const r=[];TL.forEach(a=>TL.forEach(b=>{if(a==b)return;const t=br=>{const al=[a,b].concat(br.flat());if(new Set(al).size==al.length){const q=sums(a,b,br),m=Math.min(99,...q.map((z,i)=>z==v?q.ng[i]:99));if(m<99)r.push({a,b,br,ng:m})}};t([]);cp.forEach((p,i)=>{t([p]);for(let j=i+1;j<cp.length;j++)t([p,cp[j]])})}));return r.sort((x,y)=>(TL.indexOf(x.a)>TL.indexOf(x.b))-(TL.indexOf(y.a)>TL.indexOf(y.b))||x.ng-y.ng||x.br.length-y.br.length)}

function capImg(){const o=gather(),S=2,W=720,P=24,FF='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',
