+'<p style="color:var(--mu);font-size:.85rem;margin:10px 0 0">Saisissez 3 valeurs : la 4e est calculée.</p></div>';
const SUB={t0:[['em','Émission'],['re','Réception'],['pi','PI']],t1:[['eph','📅','Éphéméride'],['em','Emz'],['re','Rez'],['pi','PI'],['ci','CI']]};
function initSub(t){const box=$(t),ps=[...box.querySelectorAll(':scope>.part,:scope>.wr')],nav=document.createElement('div');nav.className='sub';
 SUB[t].forEach(([id,n,ti],i)=>{ps[i].dataset.sp=id;const b=document.createElement('button');b.innerHTML=(n=='Emz'||n=='Rez')?lab(n):n;if(ti)b.title=ti;b.dataset.sp=id;if(id=='pi')b.className='pi';b.onclick=()=>subshow(t,id);nav.appendChild(b)});box.prepend(nav);
 subshow(t,store.get('sub'+t)||SUB[t][0][0])}

// Onglets
const names=['Constitution','Mesures','Méthode "B"','KCA'];
names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(i);b.id='tb'+i;$('tabs').appendChild(b)});
function show(i){names.forEach((_,j)=>{$('t'+j).classList.toggle('on',i==j);$('tb'+j).classList.toggle('on',i==j)});store.set('tab',i)}

 document.querySelectorAll('.sel').forEach(s=>{s.querySelector('.v').textContent=s.querySelector('select').value});['t0','t1','t3'].forEach(t=>{if(!pi&&$(t).dataset.cur=='pi')subshow(t,SUB[t][0][0])})}
function calcB(){const el=['b_kb','b_ub','b_kf','b_uf'].map(k=>document.querySelector('[data-k='+k+']'));
 el.forEach(e=>{if(e.dataset.auto){e.value='';delete e.dataset.auto;e.classList.remove('auto')}});
 if(el.filter(e=>e.value.trim()!=='').length!==3)return;
 const m=el.findIndex(e=>e.value.trim()==='');const v=el.map(e=>parseFloat(e.value.replace(',','.')));
 if(v.some((x,i)=>i!==m&&isNaN(x)))return;const[kb,ub,kf,uf]=v;
 const r=[kf*ub/uf,kb*uf/kf,kb*uf/ub,ub*kf/kb][m];if(!isFinite(r))return;
 let t;if(m==1||m==3)t=r.toFixed(3).replace('.',',');else{const f=Math.floor(r+1e-9),d=r-f;t=f+(d<1e-9?'':Math.abs(d-.5)<1e-9?'=':d>.5?'+':'-')}
 el[m].value=t;el[m].dataset.auto=1;el[m].classList.add('auto')}
const inputs=()=>[...document.querySelectorAll('[data-k]')];
function gather(){const o={zone:$('zone').value.trim(),pi:$('pi').value.trim()};inputs().forEach(e=>{o[e.dataset.k]=e.type=='checkbox'?(e.checked?'oui':''):(e.dataset.auto?'':e.value)});{const a=document.querySelector('[data-k=b_kb]'),b=document.querySelector('[data-k=b_kf]');o.kb=a.value.trim();o.kf=b.value.trim()}return o}
function fill(o){$('zone').value=o.zone||'';$('pi').value=o.pi||'';inputs().forEach(e=>{const v=o[e.dataset.k]||'';delete e.dataset.auto;e.classList.remove('auto');if(e.type=='checkbox')e.checked=v=='oui';else e.value=v});calcB();calcK();refresh()}
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset&&t.dataset.auto){delete t.dataset.auto;t.classList.remove('auto')}
 if(t.dataset.k=='m_date'){const d=t.value.replace(/\D/g,'').slice(0,8);t.value=d.replace(/^(\d{2})(\d)/,'$1/$2').replace(/^(\d{2}\/\d{2})(\d)/,'$1/$2')}
 if(t.dataset.k&&NUMK(t.dataset.k)){let v=t.value.replace(/[^0-9.,]/g,'');const i=v.search(/[.,]/);if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/[.,]/g,'').slice(0,3);t.value=v}
 if(t.dataset.k&&t.dataset.k.startsWith('b_'))calcB();refresh();store.set('draft',JSON.stringify(gather()))});
document.addEventListener('change',refresh);
const R=()=>{try{return JSON.parse(store.get('recs')||'{}')}catch(e){return {}}};
let cur=null;
const say=m=>{$('st').textContent=m};
function list(sel){const s=$('recs');s.innerHTML='<option value="">— Enregistrements —</option>';Object.keys(R()).sort().forEach(k=>{const o=document.createElement('option');o.textContent=k;s.appendChild(o)});if(sel)s.value=sel}
let curSrc=null;
function save(){const o=gather(),k=recName(o);if(!k){say('Saisissez un Zone n° pour enregistrer.');return false}const r=R();o.src=curSrc||(r[k]||{}).src;if(!o.src)delete o.src;r[k]=o;store.set('recs',JSON.stringify(r));cur=k;list(k);say('Enregistrement « '+k+' » sauvegardé.');return true}
$('bSave').onclick=save;
$('bOpen').onclick=()=>{const k=$('recs').value;if(!k)return say('Choisissez un enregistrement.');fill(R()[k]);cur=k;curSrc=R()[k].src||null;say('Enregistrement « '+k+' » ouvert.')};
$('bClose').onclick=()=>{if($('zone').value.trim())save();fill({});cur=null;curSrc=null;store.set('draft','{}');$('recs').value='';say('Enregistrement fermé.')};
$('bDel').onclick=()=>{const k=$('recs').value||cur;if(!k)return say('Choisissez un enregistrement.');const c=$('cf');
 c.innerHTML='<div style="margin-top:8px">Supprimer « '+k.replace(/</g,'&lt;')+' » ? Cette action est définitive.</div><div class="btns"><button class="r" id="cfY">Oui, supprimer</button><button id="cfN">Annuler</button></div>';
 $('cfN').onclick=()=>{c.innerHTML=''};
 $('cfY').onclick=()=>{c.innerHTML='';const r=R();delete r[k];store.set('recs',JSON.stringify(r));if(cur==k){fill({});cur=null}list();say('Enregistrement « '+k+' » supprimé.')}};
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
const NOK=['m_date','m_t1','m_t2','m_mb','m_pi_mb'];
const NUMK=k=>k.startsWith('m_')&&!NOK.includes(k);
const xname=z=>{const n=new Date(),q=z.replace(/[\\\/:*?"<>|\s]+/g,'-');return 'mesures_'+(q?q+'_':'')+[n.getFullYear()%100,n.getMonth()+1,n.getDate()].map(x=>String(x).padStart(2,'0')).join('-')+'.xlsx'};
const DSER=true;
const FM={zone:'BT2',pi:'CB3',c_em_Émetteur:'N26',c_em_TAd:'U26',c_em_SVa:'AA26',c_em_BA:'AG26',c_em_CI:'AN26',c_re_BA:'AU26',c_re_SVa:'BB26',c_re_TAd:'BI26',c_re_Récepteur:'BP26',c_re_CI:'BW26',c_pi_TAd:'N38',c_pi_Récepteur:'U38',
 m_date:'B140',m_t1:'G140',m_t2:'J140',m_em_IBE:'M140',m_em_UBE:'P140',m_em_UEM:'S140',m_em_UVE:'V140',m_re_UVR:'Y140',m_re_UV1V2:'AB140',m_re_UR1R2:'AE140',m_re_IBR:'AH140',m_re_UBR:'AK140',
 m_pi_UPI:'AN140',m_pi_UV1V2:'AQ140',m_pi_UR1R2:'AT140',m_pi_IBPI:'AW140',m_pi_UBPI:'AZ140',m_ci_UCI:'BC140',m_em_U0:'CH128',m_re_rouge:'AE141',m_pi_rouge:'AT141'};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rd=(b,o,n)=>n==2?(b[o]|b[o+1]<<8):((b[o]|b[o+1]<<8|b[o+2]<<16|b[o+3]<<24)>>>0);
function parseZip(b){let e=b.length-22;while(rd(b,e,4)!=0x06054b50)e--;const n=rd(b,e+10,2);let p=rd(b,e+16,4);const L=[],dc=new TextDecoder();
 for(let i=0;i<n;i++){const nl=rd(b,p+28,2),xl=rd(b,p+30,2),cl=rd(b,p+32,2),lo=rd(b,p+42,4),cs=rd(b,p+20,4),ln=rd(b,lo+26,2),lx=rd(b,lo+28,2),s0=lo+30+ln+lx;
  L.push({name:dc.decode(b.subarray(p+46,p+46+nl)),fl:rd(b,p+8,2)&~8,m:rd(b,p+10,2),crc:rd(b,p+16,4),us:rd(b,p+24,4),data:b.subarray(s0,s0+cs)});p+=46+nl+xl+cl}
 return L}
function writeZip(L){const en=new TextEncoder(),parts=[],cd=[];let off=0;
 L.forEach(f=>{const nb=en.encode(f.name),h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,f.fl,true);h.setUint16(8,f.m,true);h.setUint16(12,0x21,true);h.setUint32(14,f.crc,true);h.setUint32(18,f.data.length,true);h.setUint32(22,f.us,true);h.setUint16(26,nb.length,true);
  parts.push(new Uint8Array(h.buffer),nb,f.data);
  const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,f.fl,true);e.setUint16(10,f.m,true);e.setUint16(14,0x21,true);e.setUint32(16,f.crc,true);e.setUint32(20,f.data.length,true);e.setUint32(24,f.us,true);e.setUint16(28,nb.length,true);e.setUint32(42,off,true);
  cd.push(new Uint8Array(e.buffer),nb);off+=30+nb.length+f.data.length});
 const cl=cd.reduce((q,x)=>q+x.length,0),z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,L.length,true);z.setUint16(10,L.length,true);z.setUint32(12,cl,true);z.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(z.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
const strm=async(d,T)=>new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new T('deflate-raw'))).arrayBuffer());
const esc=t=>String(t).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const un=t=>t.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');

const POS={A:[0,0],B:[0,56],C:[0,57],D:[0,59],E:[1,0],F:[1,14],G:[1,21],H:[2,0],I:[2,28],K:[2,60],L:[3,0],M:[3,40]};

function calcK(){const g=k=>document.querySelector('[data-k='+k+']').value,a=g('k_c1'),b=g('k_c2'),r=$('k_res');
 const br=[['k_p1a','k_p1b'],['k_p2a','k_p2b']].map(([x,y])=>[g(x),g(y)]).filter(p=>p[0]&&p[1]);let out=null;
 const go=(cur,used,seen,s)=>{if(out!==null)return;if(POS[cur][0]==POS[b][0]){out=s+POS[b][1]-POS[cur][1];return}
  br.forEach((p,i)=>{if(used.includes(i))return;[[p[0],p[1]],[p[1],p[0]]].forEach(([x,y])=>{if(POS[x][0]==POS[cur][0]&&!seen.includes(POS[y][0]))go(y,used.concat(i),seen.concat(POS[y][0]),s+POS[x][1]-POS[cur][1])})})};
 if(a&&b)go(a,[],[POS[a][0]],0);
 r.value=!(a&&b)?'':out===null?'Circuit ouvert':out;r.classList.toggle('auto',out!==null)}
const TL=Object.keys(POS);
function sums(a,b,br){const out=[];out.ng=[];const go=(cur,used,seen,s,n)=>{if(POS[cur][0]==POS[b][0]){if(used.length==br.length){out.push(s+POS[b][1]-POS[cur][1]);out.ng.push(n+(POS[b][1]<POS[cur][1]))}return}
 br.forEach((p,i)=>{if(used.includes(i))return;[[p[0],p[1]],[p[1],p[0]]].forEach(([x,y])=>{if(POS[x][0]==POS[cur][0]&&!seen.includes(POS[y][0]))go(y,used.concat(i),seen.concat(POS[y][0]),s+POS[x][1]-POS[cur][1],n+(POS[x][1]<POS[cur][1]))})})};go(a,[],[POS[a][0]],0,0);return out}
const cp=[];TL.forEach((x,i)=>TL.slice(i+1).forEach(y=>{if(POS[x][0]!=POS[y][0])cp.push([x,y])}));
function solve(v){const r=[];TL.forEach(a=>TL.forEach(b=>{if(a==b)return;const t=br=>{const al=[a,b].concat(br.flat());if(new Set(al).size==al.length){const q=sums(a,b,br),m=Math.min(99,...q.map((z,i)=>z==v?q.ng[i]:99));if(m<99)r.push({a,b,br,ng:m})}};t([]);cp.forEach((p,i)=>{t([p]);for(let j=i+1;j<cp.length;j++)t([p,cp[j]])})}));return r.sort((x,y)=>(TL.indexOf(x.a)>TL.indexOf(x.b))-(TL.indexOf(y.a)>TL.indexOf(y.b))||x.ng-y.ng||x.br.length-y.br.length)}
